<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list — Posewise</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#FFF;--surface:#EFEBE1;--line:#E3E0D7;--ink:#201E1B;--ink-soft:#58554C;--accent:#5E7D54;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1C1A17;--surface:#26231F;--line:#3C372E;--ink:#ECE6D9;--ink-soft:#B3AB99;--accent:#8FB593}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:460px;text-align:center}
.logo{width:150px;height:38px;margin:0 auto 30px;background:url(assets/logo_light.webp) no-repeat center/contain}
@media (prefers-color-scheme:dark){.logo{background-image:url(assets/logo_dark.webp)}}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px;line-height:1.08}
p{color:var(--ink-soft);font-size:17px;line-height:1.5;margin:0 0 28px}
a{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;text-decoration:none;
font-weight:700;font-size:16px;padding:15px 28px;border-radius:999px}
@media (prefers-color-scheme:dark){a{color:#1C1A17}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>You're on the list.</h1>
    <p>We'll write the moment there's room in the beta. Nothing else — no lists, no sharing.</p>
    <a href="/">Back to Posewise</a>
  </div>
</body>
</html>
