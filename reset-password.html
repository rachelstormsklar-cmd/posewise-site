<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset your password — Posewise</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #EFEBE1;
    --surface-quiet: #F6F4EE;
    --line: #E3E0D7;
    --ink: #201E1B;
    --ink-soft: #58554C;
    --accent: #5E7D54;
    --accent-deep: #455E3D;
    --warning: #93691C;
    --warning-bg: #F1E6CE;
    --critical: #A23E3E;
    --critical-bg: #F5E4E4;
    --shadow: rgba(32, 30, 27, 0.10);

    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1A17;
      --surface: #26231F;
      --surface-quiet: #221F1B;
      --line: #3C372E;
      --ink: #ECE6D9;
      --ink-soft: #B3AB99;
      --accent: #8FB593;
      --accent-deep: #A8CBA8;
      --warning: #E0B756;
      --warning-bg: #362D1C;
      --critical: #E08A8A;
      --critical-bg: #3A2323;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1C1A17;
    --surface: #26231F;
    --surface-quiet: #221F1B;
    --line: #3C372E;
    --ink: #ECE6D9;
    --ink-soft: #B3AB99;
    --accent: #8FB593;
    --accent-deep: #A8CBA8;
    --warning: #E0B756;
    --warning-bg: #362D1C;
    --critical: #E08A8A;
    --critical-bg: #3A2323;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface-quiet);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 24px var(--shadow);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  p.sub {
    margin: 0 0 24px;
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.4;
  }

  label {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.95rem;
  }

  input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    width: 100%;
    padding: 13px 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { background: var(--accent-deep); }
  button:disabled { opacity: 0.6; cursor: default; }

  .message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    line-height: 1.4;
    display: none;
  }

  .message.error {
    display: block;
    background: var(--critical-bg);
    color: var(--critical);
  }

  .message.success {
    display: block;
    background: var(--warning-bg);
    color: var(--warning);
  }

  .hint {
    margin-top: 18px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Set a new password</h1>
  <p class="sub" id="sub">Choose a new password for your Posewise account.</p>

  <form id="form">
    <label for="password">New password</label>
    <input type="password" id="password" autocomplete="new-password" minlength="6" required>

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" autocomplete="new-password" minlength="6" required>

    <button type="submit" id="submit">Update password</button>
  </form>

  <div class="message" id="message"></div>
  <p class="hint" id="hint"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://gztnxxeputeznldujilk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dG54eGVwdXRlem5sZHVqaWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDUxOTQsImV4cCI6MjEwMjY4MTE5NH0.ImWwcANEMUnS9GBnSQGaXg0JcgUgaTooGQ56neN1T9M";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("form");
  const submitBtn = document.getElementById("submit");
  const messageEl = document.getElementById("message");
  const hintEl = document.getElementById("hint");
  const subEl = document.getElementById("sub");

  let recoveryReady = false;

  function showMessage(text, kind) {
    messageEl.textContent = text;
    messageEl.className = "message " + kind;
  }

  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoveryReady = true;
    }
  });

  setTimeout(() => {
    if (!recoveryReady) {
      sb.auth.getSession().then(({ data }) => {
        if (data.session) {
          recoveryReady = true;
        } else {
          subEl.textContent = "This reset link is invalid or has expired.";
          form.style.display = "none";
          hintEl.textContent = "Request a new reset link from the Posewise app.";
        }
      });
    }
  }, 1200);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMessage("", "");
    messageEl.className = "message";

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (password.length < 6) {
      showMessage("Password must be at least 6 characters.", "error");
      return;
    }
    if (password !== confirm) {
      showMessage("Passwords don't match.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating…";

    const { error } = await sb.auth.updateUser({ password });

    submitBtn.disabled = false;
    submitBtn.textContent = "Update password";

    if (error) {
      showMessage(error.message, "error");
    } else {
      form.style.display = "none";
      showMessage("Password updated. You can now sign in with your new password in the Posewise app.", "success");
    }
  });
</script>

</body>
</html>
